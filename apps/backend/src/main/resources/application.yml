# =============================================================================
# Stockly backend — application.yml
#
# Profile strategy:
#   - default (no -Dspring.profiles.active=) → shared sensible config
#   - dev      → local development (ddl-auto=validate, show-sql=true)
#   - prod     → strict (ddl-auto=validate, JSON logs, no SQL echo)
#
# Activate with:  SPRING_PROFILES_ACTIVE=prod mvn spring-boot:run
# =============================================================================

spring:
  application:
    name: stockly-backend

  # Load local overrides from a gitignored .env in the working directory (apps/backend).
  # Precedence: real env vars > .env > the defaults in this file. 'optional:' keeps the
  # app bootable when .env is absent (CI, Docker), it just falls through to the defaults.
  config:
    import: "optional:file:.env[.properties]"

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/stockly}
    username: ${DATABASE_USERNAME:stockly}
    password: ${DATABASE_PASSWORD:stockly_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: stockly-hikari
      connection-timeout: 5000
      validation-timeout: 3000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.time_zone: UTC
        format_sql: false
        order_inserts: true
        order_updates: true
        jdbc.batch_size: 50

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  mvc:
    problemdetails:
      enabled: true

  web:
    locale: es-CO
    locale-resolver: fixed
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  # Liquibase runs automatically on startup once changelogs exist (T3).
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  # Railway/Render/Fly/Cloud Run inject PORT; locally it falls back to 8080.
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript

# =============================================================================
# Custom application config (JWT). Bound via @ConfigurationProperties in T6.
# =============================================================================
jwt:
  # 256-bit secret minimum. Override in real environments via env var. The default
  # below is intentionally long enough for HS256 but obviously NOT production-safe.
  secret: ${JWT_SECRET:dev-secret-change-in-prod-min-256-bits-long-please-do-not-use-this}
  access-token-validity: 900      # 15 minutes (matches spec)
  refresh-token-validity: 604800  # 7 days
  issuer: stockly-backend
  cookie:
    name: stockly_rt
    # Prod (frontend on another domain, e.g. *.vercel.app): COOKIE_SECURE=true
    # + COOKIE_SAME_SITE=none. Without SameSite=None the browser refuses to
    # send the refresh cookie cross-site and the session dies after 15 min.
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:lax}
    http-only: true

# =============================================================================
# Logging — service.name for log aggregation (Logback JSON in prod).
# =============================================================================
logging:
  pattern:
    correlation: "[traceId=%X{requestId:-},correlationId=%X{correlationId:-}] "
    level: "%5p ${spring.application.name:-} [traceId=%X{requestId:-},correlationId=%X{correlationId:-}]"
  level:
    root: INFO
    com.stockly: DEBUG

# =============================================================================
# Springdoc / OpenAPI — exposed at /swagger-ui.html and /v3/api-docs.
# =============================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# =============================================================================
# Application-specific configuration (T5).
# Consumed by com.stockly.config.WebMvcConfig.
# =============================================================================
app:
  cors:
    # Comma-separated list of allowed origins for /api/** requests.
    # Empty (default) → local Next.js dev origins (http://localhost:3000 + 127.0.0.1:3000).
    # Production example: "https://stockly.example.com,https://admin.stockly.example.com"
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  web:
    pageable:
      # Hard cap on ?size= to defend against memory blowups; values above are silently clamped.
      max-page-size: 100
      # Default ?size= when the client omits the parameter.
      default-page-size: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true

# =============================================================================
# DEV profile overrides.
# =============================================================================
---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      # Liquibase (T3) is the source of truth for schema. Hibernate MUST NOT
      # mutate it. 'validate' lets startup fail loudly if entity ↔ DB drift.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.stockly: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# =============================================================================
# PROD profile overrides.
# =============================================================================
---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.stockly: INFO
    org.hibernate.SQL: WARN