# =============================================================================
# Stockly backend — mensajes por defecto (es-CO).
# Cargado por Spring MessageSource cuando locale=es-CO o no se detecta locale.
# Las claves siguen la estructura <dominio>.<entidad>.<accion>.<detalle>.
# =============================================================================

product.not.found=No se encontró el producto con id {0}.
product.sku.duplicate=Ya existe un producto con el SKU {0}.
products.create.success=Producto creado correctamente.
products.update.success=Producto actualizado correctamente.
products.delete.success=Producto eliminado correctamente.
products.list.empty=No hay productos para mostrar.

validation.failed=La solicitud contiene datos inválidos.
validation.required.field=El campo {0} es obligatorio.
validation.min.length=El campo {0} debe tener al menos {1} caracteres.
validation.max.length=El campo {0} no puede superar los {1} caracteres.
validation.positive.value=El campo {0} debe ser un número positivo.
validation.nonNegative.value=El campo {0} no puede ser negativo.

auth.unauthorized=Credenciales inválidas o sesión expirada. Inicie sesión para continuar.
auth.forbidden=No tiene permisos para realizar esta acción.
auth.token.invalid=El token de autenticación es inválido o ha caducado.
auth.token.expired=El token de autenticación ha caducado. Por favor, vuelva a iniciar sesión.
auth.refresh.invalid=El token de actualización es inválido o ya fue utilizado.
auth.account.locked=La cuenta está bloqueada. Contacte al administrador.
auth.account.disabled=La cuenta está deshabilitada.

error.internal=Error interno del servidor. El equipo técnico ha sido notificado.
error.not.found=El recurso solicitado no existe o fue movido.
error.bad.request=Solicitud incorrecta. Verifique los datos enviados.
error.conflict=Conflicto al procesar la solicitud. El estado del recurso cambió.
error.too.many.requests=Demasiadas solicitudes. Intente nuevamente en unos minutos.
auth.email.exists=Ya existe una cuenta con ese email.
