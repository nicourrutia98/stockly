<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stockly — Presentación de ingeniería</title>
<meta name="author" content="Juan Nicolas Urrutia Salcedo, Luisa Maria Jose Coronel Vargas, Ana Sofía Montaña Cedeño" />
<meta name="description" content="Stockly — plataforma de inventario. Documentación de ingeniería y estado real. Universidad Surcolombiana de Neiva, Materia Inteligencia Artificial, 2026." />
<style>
/* ============================================================
   Stockly — deck
   Sistema visual tomado de la aplicación (tokens de marca en
   apps/web/app/globals.css) y de assets/BRANDING.md.

   Reglas aplicadas (ver docs/presentacion/GUION.md):
   - Coherencia (Mayer): sin decoracion que no aporte.
   - Senalizacion: un solo acento (--accent) por lamina, y marca
     el elemento clave, no todo.
   - Redundancia: la lamina NO repite el texto que el expositor dice.
   - Segmentacion: una idea por lamina.
   - Tufte: sin chartjunk, sin sombras decorativas, mucho blanco.
   - Regla 10/20/30 de Kawasaki: cuerpo minimo equivalente a 30pt
     en pantalla de 1280x720 (aqui 26px sobre lienzo de 1280).
   ============================================================ */

/* --- fuentes embebidas --- */
{{FONTS}}

:root{
  --primary-500:#0F4C81;   /* azul marca, acciones */
  --primary-400:#1E5AA8;   /* hover / degradado */
  --primary-600:#0A3B66;   /* fondo de lamina oscura */
  --primary-700:#072B4A;   /* fondo de portada */
  --accent-500:#F5B700;    /* amarillo marca, un solo acento */
  --gray-50:#F8FAFC;
  --gray-100:#F1F5F9;
  --gray-200:#E2E8F0;
  --gray-400:#94A3B8;
  --gray-500:#64748B;
  --gray-700:#334155;
  --gray-900:#0F172A;

  --ok:#15803D; --ok-bg:#DCFCE7;
  --warn:#B45309; --warn-bg:#FEF3C7;
  --bad:#B91C1C;  --bad-bg:#FEE2E2;

  --sans:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;

  --w:1280px; --h:720px;   /* lienzo de diseno; se escala al viewport */
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#0B1220;
  font-family:var(--sans);
  color:var(--gray-900);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- escenario y escalado ---------- */
#stage{
  position:fixed; inset:0;
  display:grid; place-items:center;
}
#deck{
  position:relative;
  width:var(--w); height:var(--h);
  transform-origin:center center;
}

/* ---------- lamina ---------- */
.slide{
  position:absolute; inset:0;
  width:var(--w); height:var(--h);
  background:#fff;
  padding:64px 76px;
  display:none;
  flex-direction:column;
  overflow:hidden;
}
.slide.on{display:flex}
.slide.dark{background:linear-gradient(160deg,var(--primary-700) 0%,var(--primary-600) 55%,#0D4A80 100%);color:#fff}
.slide.soft{background:var(--gray-50)}

/* ---------- encabezados ---------- */
.eyebrow{
  font-family:var(--mono); font-size:19px; font-weight:500;
  letter-spacing:.14em; text-transform:uppercase;
  color:var(--primary-500); margin-bottom:14px;
  display:flex; align-items:center; gap:12px;
}
.dark .eyebrow{color:var(--accent-500)}
h1{font-size:70px;line-height:1.06;font-weight:700;letter-spacing:-.028em}
h2{font-size:52px;line-height:1.1;font-weight:700;letter-spacing:-.024em;margin-bottom:8px}
h3{font-size:27px;line-height:1.25;font-weight:650;letter-spacing:-.012em}
.lede{font-size:26px;line-height:1.42;color:var(--gray-700);max-width:1000px;margin-top:14px}
.dark .lede{color:#C7D8EC}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;padding:22px 0 26px}

/* ---------- pie: bloque, ponente, numero ---------- */
.foot{
  position:absolute; left:76px; right:76px; bottom:30px;
  display:flex; align-items:center; gap:14px;
  font-size:16px; color:var(--gray-500);
}
.dark .foot{color:#8FAAC9}
.foot .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55}
.foot .who{color:var(--primary-500);font-weight:600}
.dark .foot .who{color:var(--accent-500)}
.foot .spacer{flex:1}
.foot .n{font-family:var(--mono);font-size:15px}

/* ---------- red de 3 puntos: el bloque del ponente ---------- */
.blocks{display:flex;gap:10px}
.blocks i{width:34px;height:5px;border-radius:3px;background:var(--gray-200);display:block}
.blocks i.on{background:var(--primary-500)}
.dark .blocks i{background:rgba(255,255,255,.28)}
.dark .blocks i.on{background:var(--accent-500)}

/* ---------- rejilla de 3 ideas (regla de tres) ---------- */
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:6px}
.card{
  border:1px solid var(--gray-200); border-radius:14px;
  padding:26px 24px; background:#fff;
  display:flex; flex-direction:column; gap:10px;
}
.card .k{
  font-family:var(--mono);font-size:17px;font-weight:500;
  color:var(--primary-500);letter-spacing:.06em;
}
.card p{font-size:20px;line-height:1.45;color:var(--gray-700)}
.card strong{color:var(--gray-900);font-weight:650}

/* ---------- listas ---------- */
ul.list{list-style:none;display:flex;flex-direction:column;gap:16px}
ul.list li{
  font-size:25px; line-height:1.38; color:var(--gray-700);
  padding-left:34px; position:relative;
}
ul.list li::before{
  content:''; position:absolute; left:6px; top:.52em;
  width:9px;height:9px;border-radius:2px;background:var(--primary-500);
}
.dark ul.list li{color:#D8E6F5}
.dark ul.list li::before{background:var(--accent-500)}
ul.list li strong{color:var(--gray-900);font-weight:650}
.dark ul.list li strong{color:#fff}

/* ---------- el bloque de respuesta (Minto: la respuesta va primero) ---------- */
.answer{
  border-left:5px solid var(--accent-500);
  background:rgba(255,255,255,.07);
  padding:30px 34px; border-radius:0 12px 12px 0;
}
.answer .tag{
  font-family:var(--mono);font-size:17px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent-500);margin-bottom:10px;
}
.answer p{font-size:33px;line-height:1.28;font-weight:600;color:#fff;letter-spacing:-.015em}

/* ---------- cifras ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.stat{border-top:4px solid var(--primary-500);padding-top:16px}
.stat .v{font-size:62px;font-weight:700;letter-spacing:-.035em;line-height:1;color:var(--gray-900)}
.stat .v.accent{color:var(--accent-500)}
.stat .l{font-size:19px;line-height:1.32;color:var(--gray-500);margin-top:10px}
.stat.soft{border-top-color:var(--gray-200)}
.stat.warn{border-top-color:var(--warn)}
.stat.bad{border-top-color:var(--bad)}

/* ---------- capturas ---------- */
.shot{
  border:1px solid var(--gray-200); border-radius:12px; overflow:hidden;
  background:#fff; box-shadow:0 1px 2px rgba(15,23,42,.06);
}
.shot img{display:block;width:100%;height:auto}
.shot figcaption{
  font-family:var(--mono); font-size:15px; color:var(--gray-500);
  padding:9px 14px; border-top:1px solid var(--gray-200); background:var(--gray-50);
}
.two{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
.two.wide-left{grid-template-columns:1.35fr 1fr}

/* ---------- etiquetas de estado ---------- */
.tag{
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--mono); font-size:16px; font-weight:500;
  padding:5px 12px; border-radius:999px; letter-spacing:.02em;
}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.info{background:#DBEAFE;color:var(--primary-600)}
.tag.mute{background:var(--gray-100);color:var(--gray-500)}

/* ---------- linea de tiempo / secuencia ---------- */
.flow{display:flex;align-items:stretch;gap:0;margin-top:4px}
.flow .step{
  flex:1; border:1px solid var(--gray-200); border-right:0;
  padding:18px 20px; background:#fff;
}
.flow .step:first-child{border-radius:12px 0 0 12px}
.flow .step:last-child{border-right:1px solid var(--gray-200);border-radius:0 12px 12px 0}
.flow .step .n{font-family:var(--mono);font-size:16px;color:var(--primary-500);font-weight:500}
.flow .step p{font-size:19px;line-height:1.34;color:var(--gray-700);margin-top:6px}

/* ---------- barra de honestidad: el dato que sorprende ---------- */
.honest{
  background:var(--gray-50); border:1px solid var(--gray-200);
  border-left:5px solid var(--accent-500);
  border-radius:0 12px 12px 0; padding:24px 28px;
}
.honest .t{font-family:var(--mono);font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn);margin-bottom:8px}
.honest p{font-size:23px;line-height:1.4;color:var(--gray-700)}
.honest p strong{color:var(--gray-900);font-weight:650}

/* ---------- portada ---------- */
.cover{justify-content:center;padding:0 96px}
.cover .logo{display:flex;align-items:center;gap:16px;margin-bottom:34px}
.cover h1{font-size:82px;max-width:960px}
.cover .sub{font-size:27px;color:#C7D8EC;margin-top:18px;max-width:880px;line-height:1.38}
.cover .rule{width:96px;height:6px;background:var(--accent-500);border-radius:3px;margin:30px 0 26px}
.cover .auth{display:flex;flex-direction:column;gap:8px;font-size:21px;color:#E6EFFA}
.cover .auth b{color:#fff;font-weight:650}
.cover .inst{font-family:var(--mono);font-size:17px;color:#8FAAC9;letter-spacing:.04em;margin-top:6px;padding-bottom:34px}

/* ---------- cierre ---------- */
.end{display:grid;grid-template-columns:1.05fr 1fr;gap:52px;align-items:center;height:100%}
.end h1{font-size:60px;margin-bottom:18px}
.end .links{display:flex;flex-direction:column;gap:14px;font-size:21px;color:var(--gray-700)}
.end .links div{display:flex;gap:12px;align-items:baseline}
.end .links span{font-family:var(--mono);font-size:16px;color:var(--primary-500);min-width:104px}

/* ---------- barra de progreso ---------- */
#bar{position:fixed;left:0;bottom:0;height:4px;background:var(--accent-500);transition:width .28s ease;z-index:20}

/* ---------- ayuda ---------- */
#help{
  position:fixed; right:20px; bottom:18px; z-index:20;
  font-family:var(--mono); font-size:13px;
  color:#5C7A9E; background:rgba(11,18,32,.82); padding:7px 12px;
  border-radius:8px; opacity:.2; transition:opacity .25s;
  animation:none;
}
/* se apaga sola a los 5 s para no quedar en las capturas ni en la proyeccion;
   vuelve a aparecer al pasar el puntero por encima */
#help{opacity:0}
#help:hover{opacity:1}
#help b{color:var(--accent-500)}

/* ---------- notas del expositor (impresion / guia) ---------- */
.notes{display:none}

/* ============================================================
   Impresion: una lamina por pagina, horizontal
   ============================================================ */
@page{size:1280px 720px; margin:0}
@media print{
  html,body{background:#fff;overflow:visible}
  #bar,#help{display:none}
  #stage{position:static;display:block}
  #deck{width:auto;height:auto;transform:none!important}
  .slide{
    position:relative; display:flex!important;
    page-break-after:always; break-after:page;
    box-shadow:none; border:0;
  }
  .notes{display:block;font-size:15px;color:var(--gray-700);
    border-top:1px dashed var(--gray-200);padding-top:12px;margin-top:14px;line-height:1.45}
}
</style>
</head>
<body>

<div id="stage"><div id="deck">
{{SLIDES}}
</div></div>

<div id="bar"></div>
<div id="help">
  <b>&larr; &rarr;</b> navegar · <b>f</b> pantalla completa · <b>p</b> imprimir a PDF
</div>

<script>
(function () {
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var deck = document.getElementById('deck');
  var bar = document.getElementById('bar');
  var i = 0;

  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    slides.forEach(function (s, k) { s.classList.toggle('on', k === i); });
    bar.style.width = ((i + 1) / slides.length * 100) + '%';
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
  }

  /* escala al viewport: el lienzo es 1280x720 siempre */
  function fit() {
    var k = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    deck.style.transform = 'scale(' + k + ')';
  }

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') { show(i + 1); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { show(i - 1); e.preventDefault(); }
    else if (k === 'Home') show(0);
    else if (k === 'End') show(slides.length - 1);
    else if (k === 'f' || k === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
    else if (k === 'p' || k === 'P') { window.print(); }
  });

  document.addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    show(e.clientX < window.innerWidth * 0.28 ? i - 1 : i + 1);
  });

  /* swipe tactil */
  var x0 = null;
  document.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 45) show(dx < 0 ? i + 1 : i - 1);
    x0 = null;
  }, { passive: true });

  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function () {
    var n = parseInt(location.hash.slice(1), 10);
    if (n) show(n - 1);
  });

  fit();
  show(parseInt(location.hash.slice(1), 10) - 1 || 0);
})();
</script>
</body>
</html>
